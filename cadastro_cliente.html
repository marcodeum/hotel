<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Cliente</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1 class="titulo_principal"
        style="color: blue; background-color: black; border: 2px solid darkblue; margin: auto; border-radius: 5px; width: 400px; border-image: linear-gradient(to right, blue, red, yellow) 1;">
        Hotel<span style="color: red;">Sys</span> <span style="color: yellow;">tem</span></h1>
    <br>
    <h2 class="titulo_secundario" style="text-decoration: underline;">Cadastro de Cliente</h2>
    <form class="form" action="salvar_cliente.php" method="post">
        <label class="label" for="nome">Nome Completo</label><br>
        <input class="input" type="text" id="nome" name="nome" placeholder="Ex: Marco Túlio" required><br>
        <label class="label" for="email">Email</label><br>
        <input class="input" type="email" id="email" name="email" placeholder="Ex: seuemail@email.com.br" required><br>
        <label class="label" for="tel">Telefone</label><br>
        <input class="input" type="text" id="tel" name="tel" placeholder="Ex: (xx) xxxxx-xxxx" required><br>
        <label class="label" for="senha">Senha</label><br>
        <input class="input" type="password" id="senha" name="senha" placeholder="Ex: senha123" required><br><br>
        <button class="btn-enviar" type="submit">CADASTRAR</button>
    </form>
    <br><br>
    <a href="login.html">LOGIN</a>
</body>

</html>
